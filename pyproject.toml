[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vlm-grounding-eval"
version = "0.1.0"
description = "Reproducible POPE and no-target coordinate grounding evaluation"
requires-python = ">=3.10"
dependencies = ["PyYAML>=6,<7", "Pillow>=10,<12"]

[project.optional-dependencies]
models = ["torch>=2.5,<3", "transformers>=5.2,<6", "huggingface-hub>=1,<2", "safetensors>=0.7,<1"]
test = ["pytest>=7.4,<9"]

[project.scripts]
vlm-eval = "vlm_eval.cli:main"

[tool.setuptools.packages.find]
include = ["vlm_eval*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
